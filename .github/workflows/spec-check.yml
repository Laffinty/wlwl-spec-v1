name: spec-check

# WLWL v1.0 规范文本门禁。
#
# 三件事:
#   1 check_spec.py —— 一致性册 §6.1 的七项文本检查(错误级 = 门禁失败)
#   2 negctl.py     —— 检查器自身的阴性对照(证明第 1 项的绿灯不是假的)
#   3 示例可运行性 —— 由 check_spec.py 的第 7 项承担,需要参考实现
#
# 参考实现从上游仓按**钉死的提交**构建,不是下载 release 产物 ——
# 规范的「上游基线」写的就是那个提交,用它才能让规范与被验对象同版本。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # 上游基线:**完整 40 位 SHA**。
  #
  # ⚠⚠ 这里**不能写缩写**(`99041ef`)。`actions/checkout` 拿到缩写 SHA 时
  # 认不出它是提交 —— 它会退化成「当分支 / 标签找」,于是 fetch 的是
  # `+refs/heads/99041ef*` 与 `+refs/tags/99041ef*`,两者都不存在
  # ⇒ `git fetch` exit 1 ⇒ job 直接红(2026-10-21 首次运行即如此)。
  # 短形式只用于**人读**与下面的 grep 核对。
  #
  # ⚠ 这条基线 = **已发布的 tag `v0.11.4`**(2026-10-24)的提交。它含
  # v1.0 语义(E0103 批次)+ 一致性册 §5.4 那 **13 条收敛**
  # (X-01 / X-02 / X-06 / X-07 / X-15…X-24)。
  # ⚠ 旧基线 `46b153b`(2026-10-22)**落后 34 个提交** ⇒ 第 7 项
  # 「示例有效性」对那些行为**没有鉴别力**:钉在没有这些收敛的提交上,
  # 故意演示 `E0103` 的示例会「绿」而它旁边的注释是假的
  # ⇒ 2026-10-25 前移到本提交。
  #
  # ⚠⚠ **改基线时这一行与各册册首的基线行必须一起改** —— 下面的
  # 「核对上游提交与规范册首记录一致」这一步就是查这两处是否一致 ⇒
  # 只改一边 ⇒ job 直接红(2026-10-22 踩过:册首跟到 46b153b 而这里还在
  # 1a76635 ⇒ grep 不到短形式 ⇒ 门禁红)。
  WLWL_UPSTREAM_REF: 176603220602d705c56f0da3d11895dfb3304c84
  # 各册册首「上游基线」行记录的短形式(7 位)—— 核对与 grep 用它。
  WLWL_UPSTREAM_SHORT: 1766032

jobs:
  check:
    name: 规范文本检查
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout 规范仓
        uses: actions/checkout@v4

      - name: Checkout 参考实现(钉死提交)
        uses: actions/checkout@v4
        with:
          repository: Laffinty/wlwl
          ref: ${{ env.WLWL_UPSTREAM_REF }}
          path: upstream

      - name: 核对上游提交与规范册首记录一致
        run: |
          set -euo pipefail
          actual="$(git -C upstream rev-parse HEAD)"
          echo "上游实际提交:${actual}(短形式 ${WLWL_UPSTREAM_SHORT})"
          if [ "${actual}" != "${WLWL_UPSTREAM_REF}" ]; then
            echo "::error::上游提交 ${actual} 与 WLWL_UPSTREAM_REF ${WLWL_UPSTREAM_REF} 不一致"
            exit 1
          fi
          # 各册册首的「上游基线」行必须写同一个提交号(短形式)。
          #
          # ⚠ **逐册校验**,不是「至少一处命中」—— 旧写法 `grep -rq` 只要**任一册**
          #   命中就过 ⇒ 漏改一册不会被抓到 ⇒ 那一册的「上游基线」仍钉着旧提交
          #   ⇒ 册子里的实测读数与实现对不上 ⇒ **静默失真**。
          #   (2026-10-25 踩过:旧基线 `46b153b` 落后 34 个提交,而一致性册 §5.4
          #   里有 13 条收敛只存在于新基线里。)
          #
          # ⚠ 只认**册首**那一行(`^> ` 开头的blockquote 行)—— 正文里
          #   「在上游基线 `46b153b` 上同样存在」这类**历史观测记录**必须保留。
          # ⚠ 没有册首基线行的册(总纲 / 一致性册)**允许没有** ⇒ 跳过。
          missing=0
          for f in docs/spec/*.md docs/stdlib/*.md; do
            line="$(grep -m1 -E '^> .*上游基线' "$f" || true)"
            [ -z "${line}" ] && continue
            case "${line}" in
              *"${WLWL_UPSTREAM_SHORT}"*) ;;
              *) echo "::error::${f} 的册首基线行与 ${WLWL_UPSTREAM_SHORT} 不一致: ${line}"; missing=1 ;;
            esac
          done
          if [ "${missing}" != "0" ]; then
            echo "::error::有册子的册首基线行没跟上 ${WLWL_UPSTREAM_SHORT}"
            exit 1
          fi
          # 至少一册必须记录基线(否则上面那个循环等于没跑)
          if ! grep -rq "${WLWL_UPSTREAM_SHORT}" docs/spec/ docs/stdlib/; then
            echo "::error::没有册子在册首记录上游基线 ${WLWL_UPSTREAM_SHORT}"
            exit 1
          fi

      - name: 安装 Rust 工具链
        run: |
          set -euo pipefail
          # 工具链钉在 upstream/rust-toolchain.toml,不传 channel 让 rustup 自己读。
          cd upstream
          rustup toolchain install --profile default
          rustc --version

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            upstream/impl/target
            ~/.cargo/registry
            ~/.cargo/git
          key: spec-check-cargo-${{ env.WLWL_UPSTREAM_REF }}-${{ hashFiles('upstream/impl/Cargo.lock') }}
          restore-keys: |
            spec-check-cargo-${{ env.WLWL_UPSTREAM_REF }}-

      - name: 构建参考实现
        working-directory: upstream/impl
        run: |
          set -euo pipefail
          # ⚠ `impl/Cargo.lock` 在上游仓是**故意不入库**的(`.gitignore` 明写
          # 「为它单独生成一份锁文件」)⇒ `--locked` 在锁文件缺失时直接失败:
          #   error: cannot create the lock file ... because --locked was passed
          # ⇒ 与上游仓 CI 的「Materialize Cargo.lock (if missing)」步骤对齐。
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi
          cargo build --locked --release --bin wlwl

      - name: 文本检查
        run: python3 script/check_spec.py --impl upstream/impl/target/release/wlwl

      - name: 检查器阴性对照
        run: python3 script/negctl.py --impl upstream/impl/target/release/wlwl
